name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          echo "Zip dosyası çıkarılıyor..."
          unzip -o muguet-0.1.zip
          ls -la

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Check Xcode & Project Files
        run: |
          xcodebuild -version
          find . -maxdepth 3 -name "*.xcodeproj" -o -name "*.xcworkspace"
