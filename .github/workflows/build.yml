name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Project with xcodebuild
        run: |
          # Proje veya workspace dosyasını alt klasörlerde otomatik bul
          PROJECT_FILE=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          WORKSPACE_FILE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          
          mkdir -p build
          
          if [ -n "$WORKSPACE_FILE" ]; then
            echo "Bulunan Workspace: $WORKSPACE_FILE"
            xcodebuild clean build \
              -workspace "$WORKSPACE_FILE" \
              -scheme "GTA5" \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR=build
          elif [ -n "$PROJECT_FILE" ]; then
            echo "Bulunan Proje: $PROJECT_FILE"
            xcodebuild clean build \
              -project "$PROJECT_FILE" \
              -scheme "GTA5" \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR=build
          else
            echo "Hata: Xcode proje dosyası (.xcodeproj veya .xcworkspace) bulunamadı!"
            exit 1
          fi

      - name: Package to IPA
        run: |
          mkdir -p Payload
          mv build/*.app Payload/ 2>/dev/null || mv build/*/*.app Payload/
          zip -r GTA5-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA5-iOS-IPA
          path: GTA5-iOS.ipa
