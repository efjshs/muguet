- name: Build Project with xcodebuild
        run: |
          # Proje veya workspace dosyasını otomatik olarak bul
          PROJECT_FILE=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          WORKSPACE_FILE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          
          mkdir -p build
          
          if [ -n "$WORKSPACE_FILE" ]; then
            echo "Bulunan Workspace: $WORKSPACE_FILE"
            xcodebuild clean build \
              -workspace "$WORKSPACE_FILE" \
              -scheme "GTA5" \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR=build
          elif [ -n "$PROJECT_FILE" ]; then
            echo "Bulunan Proje: $PROJECT_FILE"
            xcodebuild clean build \
              -project "$PROJECT_FILE" \
              -scheme "GTA5" \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR=build
          else
            echo "Hata: Xcode proje dosyası (.xcodeproj veya .xcworkspace) bulunamadı!"
            exit 1
          fi
