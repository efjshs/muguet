name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          echo "Zip dosyası açılıyor..."
          unzip -o muguet-0.1.zip
          ls -la

      - name: Set up Rust (1.98.1)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios, aarch64-apple-darwin

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Run iOS Build Script
        env:
          TEAM: "0123456789"
        run: |
          cd muguet-0.1
          echo "Derleme betikleri çalıştırılabilir yapılıyor..."
          chmod +x make-ios.sh make-app.sh
          echo "iOS derlemesi ve IPA paketleme başlatılıyor..."
          ./make-ios.sh --ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: muguet-ipa
          path: muguet-0.1/**/*.ipa
